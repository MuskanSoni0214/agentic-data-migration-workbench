<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="api-base" content="/api">
<title>Migration Workbench</title>
<style>
:root{--bg:#f1f3f2;--pn:#fff;--ink:#16242a;--mu:#5c6a6e;--ln:#d4d9d6;--ac:#1d5c63;--ok:#1e7a46;--okb:#dff1e6;--wn:#8a5a00;--wnb:#fbefc9;--er:#b3261e;--erb:#fbe0dd;--in:#1f4f99;--inb:#dde8f8;--grb:#e6e8e6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 system-ui,Segoe UI,sans-serif}
.app{display:flex;min-height:100vh}nav{width:200px;background:var(--ac);padding:12px 8px;flex:none}nav b{display:block;color:#fff;margin:4px 8px 12px}nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#d8eef0;padding:6px 10px;border-radius:5px;font:inherit;cursor:pointer}nav button.on{background:#ffffff2a;color:#fff;font-weight:600}
main{flex:1;min-width:0;padding:16px 20px;max-width:1200px}h2{margin:0 0 2px;font-size:20px}h3{margin:0 0 6px;font-size:14px}.mu{color:var(--mu)}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:12px 14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:8px 12px}.stat b{display:block;font-size:22px}.stat span{color:var(--mu);font-size:12px}
table{border-collapse:collapse;width:100%}.tw{overflow-x:auto}th,td{text-align:left;padding:5px 7px;border-bottom:1px solid var(--ln);vertical-align:top}th{color:var(--mu);font-weight:600}tr.click{cursor:pointer}tr.click:hover{background:var(--grb)}
.b{display:inline-block;padding:0 7px;border-radius:9px;font-size:12px;font-weight:600}.green{background:var(--okb);color:var(--ok)}.yellow{background:var(--wnb);color:var(--wn)}.red{background:var(--erb);color:var(--er)}.blue{background:var(--inb);color:var(--in)}.gray{background:var(--grb);color:var(--mu)}
button.p,button.s,button.d{font:inherit;padding:5px 11px;border-radius:5px;cursor:pointer;border:1px solid var(--ac)}button.p{background:var(--ac);color:#fff}button.s{background:none;color:var(--ac)}button.d{background:var(--er);border-color:var(--er);color:#fff}button:disabled{opacity:.45;cursor:not-allowed}
select,input,textarea{font:inherit;border:1px solid var(--ln);border-radius:4px;padding:3px 6px;background:#fff;color:var(--ink)}textarea{width:100%;font-family:ui-monospace,monospace;font-size:12px}
pre{background:var(--grb);padding:8px;border-radius:5px;overflow:auto;margin:0;font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
#st{position:sticky;top:0;z-index:5;padding:6px 12px;border-radius:5px;margin-bottom:10px;display:none}#st.show{display:block}#st.ok{background:var(--okb);color:var(--ok)}#st.err{background:var(--erb);color:var(--er)}#st.busy{background:var(--inb);color:var(--in)}
dialog{border:1px solid var(--ln);border-radius:8px;max-width:520px;width:92%}.f{display:block;margin:6px 0}.f span{display:block;color:var(--mu)}
.banner{background:var(--inb);color:var(--in);padding:6px 10px;border-radius:5px;margin:8px 0 12px;font-weight:600}
@media(max-width:760px){.sys{display:none}.app{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto}nav b{display:none}nav button{width:auto;white-space:nowrap}}
</style></head><body>
<div class="app"><nav id="nav"></nav><main><div id="st" role="status"></div><div id="m"></div></main></div>
<dialog id="dlg"></dialog>
<script>
/* ===== API layer: the only place that talks to the backend ===== */
const BASE=document.querySelector('meta[name=api-base]').content;
async function call(method,path,body){
  let r;try{r=await fetch(BASE+path,{method,headers:body!==undefined?{'Content-Type':'application/json'}:{},body:body!==undefined?JSON.stringify(body):undefined})}catch(e){throw new Error('Network error: cannot reach the API')}
  const t=await r.json().catch(()=>null);
  if(!r.ok){const d=t&&t.detail;const msg=typeof d==='string'?d:Array.isArray(d)?d.map(x=>x.msg).join('; '):r.statusText;
    throw new Error((r.status>=500?'Server error: ':r.status===409?'':r.status===404?'Not found: ':'Validation: ')+msg)}
  return t}
const api={projects:()=>call('GET','/projects'),project:i=>call('GET','/projects/'+i),create:b=>call('POST','/projects',b),demo:()=>call('POST','/demo'),reset:()=>call('POST','/demo/reset'),
 trans:()=>call('GET','/transformations'),analyze:i=>call('POST',`/projects/${i}/analyze`),plans:i=>call('GET',`/projects/${i}/plans`),
 putMaps:(p,m)=>call('PUT',`/plans/${p}/mappings`,{mappings:m}),addMap:(p,m)=>call('POST',`/plans/${p}/mappings`,m),risk:(p,r,s)=>call('POST',`/plans/${p}/risks/${r}`,{status:s}),
 question:(i,q,s,a)=>call('POST',`/projects/${i}/questions/${q}`,{status:s,answer:a}),approve:p=>call('POST',`/plans/${p}/approve`,{approved_by:'demo.user',confirm:true}),
 compare:(a,b)=>call('GET',`/plans/${a}/compare/${b}`),dry:p=>call('POST',`/plans/${p}/dry-run`),dries:i=>call('GET',`/projects/${i}/dry-runs`),recs:d=>call('GET',`/dry-runs/${d}/records`),
 quar:(i,q)=>call('GET',`/projects/${i}/quarantine?${q}`),exec:(p,d)=>call('POST',`/plans/${p}/execute`,{dry_run_id:d,confirm:true}),runs:i=>call('GET',`/projects/${i}/migration-runs`),
 target:()=>call('GET','/target-records'),recon:r=>call('POST',`/migration-runs/${r}/reconcile`),getRecon:r=>call('GET',`/migration-runs/${r}/reconciliation`),rollback:r=>call('POST',`/migration-runs/${r}/rollback`,{confirm:true}),
 status:()=>call('GET','/status'),history:i=>call('GET',`/projects/${i}/history`),schema:(i,k,b)=>call('POST',`/projects/${i}/${k}-schema`,b),samples:(i,r)=>call('POST',`/projects/${i}/sample-records`,{records:r})};

/* ===== UI cache (backend is the source of truth) ===== */
const C={pid:+localStorage.getItem('pid')||null,view:'projects',projects:[],P:null,plans:[],sel:null,dries:[],runs:[],hist:[],trans:[],target:[],recon:{},recs:null,detail:null,quar:[],qf:{},cmp:null,open:null};
const e=s=>String(s??'null').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bd=(t,k)=>`<span class="b ${k}">${e(t)}</span>`,sev=s=>bd(s,{HIGH:'red',MEDIUM:'yellow',LOW:'green'}[s]||'gray');
const $=id=>document.getElementById(id);
const plan=()=>C.plans.find(p=>p.id===C.sel)||C.plans[C.plans.length-1];
function status(kind,msg){const s=$('st');s.className='show '+kind;s.textContent=msg;if(kind==='ok')setTimeout(()=>{if(s.textContent===msg)s.className=''},3500)}
async function act(label,fn,done){status('busy',label+'...');try{const r=await fn();await load();status('ok',done||label+' completed.');return r}catch(x){status('err',x.message+'  (use the button again to retry)');render()}}
async function load(){
  C.sys=await api.status().catch(()=>null);C.projects=await api.projects(); if(!C.trans.length)C.trans=await api.trans(); C.target=await api.target();
  if(C.pid&&!C.projects.some(p=>p.id===C.pid))C.pid=null;
  if(C.pid){const i=C.pid;[C.P,C.plans,C.dries,C.runs,C.hist]=await Promise.all([api.project(i),api.plans(i),api.dries(i),api.runs(i),api.history(i)]);
    if(!C.plans.some(p=>p.id===C.sel))C.sel=null; const q=new URLSearchParams(C.qf);C.quar=await api.quar(i,q.toString());
    C.recon={};for(const r of C.runs){try{C.recon[r.id]=await api.getRecon(r.id)}catch{}}} else {C.P=null;C.plans=[];C.dries=[];C.runs=[];C.hist=[]}
  render()}
function open_(id,view){C.pid=id;localStorage.setItem('pid',id);C.view=view||'plan';C.sel=null;C.recs=null;C.detail=null;load().catch(fail)}
function fail(x){status('err',x.message);render()}

/* ===== views ===== */
const NAV=[['projects','Projects'],['data','Schemas & Data'],['rules','Transformations'],['ai','AI Analysis'],['plan','Migration Plan'],['appr','Approval'],['dry','Dry Run'],['quar','Quarantine'],['exec','Execute'],['recon','Reconciliation'],['rb','Rollback'],['hist','History']];
const tbl=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.join('')}</table></div>`;
const hd=(t,s)=>`<h2>${t}</h2><div class="mu">${s||''}</div><div class="banner">AI-generated plan — requires human approval before execution.</div>`;
const needP=()=>C.P?'':'<div class="card">Open or create a project first (Projects).</div>';
const stats=a=>`<div class="grid">${a.map(x=>`<div class="stat"><b>${e(x[1])}</b><span>${x[0]}</span></div>`).join('')}</div>`;
const V={
projects(){return hd('Migration Projects','One source, one target, bounded sample. Stored in SQLite via the API.')+`<div class="card"><div class="row"><button class="p" onclick="act('Loading demo',async()=>{const r=await api.demo();C.pid=r.project_id;localStorage.setItem('pid',C.pid)},'Demo loaded.')">Load Demo Migration</button><button class="s" onclick="if(confirm('Reset deletes ALL data and reloads the demo. Continue?'))act('Resetting demo',async()=>{const r=await api.reset();C.pid=r.project_id;localStorage.setItem('pid',C.pid)},'Demo reset.')">Reset Demo</button></div>
 <div class="row"><input id="pn" placeholder="Project name"><input id="ps" placeholder="Source name"><input id="pt" placeholder="Target name"><input id="pm" type="number" value="50" min="1" max="500" style="width:70px" title="Max sample size"><button class="s" onclick="act('Creating project',async()=>{const r=await api.create({name:pn.value,source_name:ps.value||'source',target_name:pt.value||'target',max_sample_size:+pm.value});C.pid=r.id;localStorage.setItem('pid',r.id);C.view='data'})">Create project</button></div></div>
 <div class="card">${C.projects.length?tbl(['Name','Source','Target','Plan','Status','Last run','Reconciliation','Updated',''],C.projects.map(p=>`<tr><td>${e(p.name)}</td><td>${e(p.source_name)}</td><td>${e(p.target_name)}</td><td>${p.plan_version?'v'+p.plan_version:'-'}</td><td>${p.plan_version?bd(p.plan_approved?'approved':'draft',p.plan_approved?'green':'yellow'):bd('no plan','gray')}</td><td>${p.last_run?'#'+p.last_run.id+(p.last_run.rolled?' (rolled back)':''):'-'}</td><td>${p.reconciliation?bd(p.reconciliation,p.reconciliation==='PASS'?'green':'red'):'-'}</td><td>${e(p.updated_at)}</td><td><button class="s" onclick="open_(${p.id},'plan')">Open</button> <button class="s" onclick="open_(${p.id},'hist')">History</button></td></tr>`)):'No projects yet. Load the demo or create one.'}</div>`},
data(){if(!C.P)return hd('Schemas & Data')+needP();const P=C.P;return hd('Schemas & Data',e(P.name))+`<div class="card"><pre>Source: 1   Target: 1   Maximum sample size: ${P.max_n}\nExternal connectors: Disabled   Production database access: Disabled   Arbitrary transformation code: Disabled</pre></div>
 <div class="card"><h3>Source schema</h3><textarea id="ss" rows="5">${e(JSON.stringify(P.src,null,1))}</textarea><div class="row"><button class="s" onclick="saveJ('ss','source')">Save source schema</button></div></div>
 <div class="card"><h3>Target schema</h3><textarea id="ts" rows="7">${e(JSON.stringify(P.tgt,null,1))}</textarea><div class="row"><button class="s" onclick="saveJ('ts','target')">Save target schema</button></div></div>
 <div class="card"><h3>Sample records (${P.recs.length} / ${P.max_n})</h3><textarea id="sr" rows="6">${e(JSON.stringify(P.recs))}</textarea><div class="row"><button class="s" onclick="saveS()">Validate &amp; save samples</button></div></div>`},
rules(){return hd('Supported Transformations','Loaded from GET /api/transformations')+`<div class="card">${tbl(['Name','Description','Input','Output','Multi-field'],C.trans.map(t=>`<tr><td><code>${t.name}</code></td><td>${e(t.description)}</td><td>${t.input_type}</td><td>${t.output_type}</td><td>${t.multi_field?'yes':''}</td></tr>`))}</div>`},
ai(){if(!C.P)return hd('AI Analysis')+needP();const p=C.plans[0],a=C.plans.find(x=>x.analysis);
 return hd('AI Analysis','Read-only agent tools: inspect, validate, generate plan. It cannot execute, insert or roll back.')+`<div class="row"><button class="p" onclick="act('Running analysis',()=>api.analyze(C.pid),'Analysis completed.')">${p?'Re-run AI analysis (creates a new draft version)':'Run AI analysis'}</button></div>`+(a?`
 <div class="card"><h3>Missing target fields</h3>${a.analysis.missing_fields.map(x=>bd(x,'yellow')).join(' ')||'none'}<h3 style="margin-top:8px">Incompatible fields</h3>${a.analysis.incompatible_fields.length?a.analysis.incompatible_fields.map(x=>`<div>${e(x.sources)}: ${e(x.errors.join('; '))}</div>`).join(''):'none'}<h3 style="margin-top:8px">Suggested transformations</h3>${a.analysis.suggested_transformations.map(x=>`${e(x.source)} → ${e(x.target)}: <code>${x.transformation}</code>`).join('<br>')||'none'}</div>
 ${a.maps.filter(m=>m.confidence!=='HIGH').map(m=>`<div class="card">${bd('UNCERTAIN MAPPING','yellow')} ${e(m.sources)} → ${e(m.targets)}<br><span class="mu">${e(m.reason)}. Clarification required.</span></div>`).join('')}
 <div class="card"><h3>Mapping proposals</h3>${tbl(['Source','Target','Types','Transformation','Confidence','Risk','Reason'],a.maps.map(m=>`<tr><td>${e(m.sources)}</td><td>${e(m.targets)}</td><td>${m.source_type||''} → ${m.target_type||''}</td><td><code>${m.transform}</code></td><td>${bd(m.confidence,m.confidence==='HIGH'?'green':'yellow')}</td><td>${sev(m.risk)}</td><td>${e(m.reason)}</td></tr>`))}</div>`:'')+qrisk()},
plan(){if(!C.P)return hd('Migration Plan')+needP();const p=plan();if(!p)return hd('Migration Plan')+'<div class="card">No plan yet. Run AI analysis first.</div>';
 return hd('Migration Plan',`Plan v${p.v} — ${p.approved?'Approved (immutable: edits create the next version)':'Draft'}`)+`<div class="card"><h3>Versions</h3>${tbl(['Version','Status','Approved at','Mappings','Risks',''],C.plans.map(x=>`<tr><td>v${x.v}</td><td>${bd(x.approved?'Approved':'Draft',x.approved?'green':'yellow')}</td><td>${e(x.approval&&x.approval.approved_at)}</td><td>${x.maps.length}</td><td>${x.risks.length}</td><td><button class="s" onclick="C.sel=${x.id};render()">View</button> ${C.plans.indexOf(x)>0?`<button class="s" onclick="cmp(${C.plans[C.plans.indexOf(x)-1].id},${x.id})">Compare with previous</button>`:''}</td></tr>`))}${C.cmp?`<pre>Compare v${C.cmp.from} → v${C.cmp.to}\nAdded: ${e(C.cmp.added.join(', ')||'none')}\nRemoved: ${e(C.cmp.removed.join(', ')||'none')}\nChanged: ${e(C.cmp.changed.join(', ')||'none')}</pre>`:''}</div>
 <div class="card"><div class="row"><h3 style="margin:0">Mappings</h3><button class="p" onclick="mapDlg(-1)">+ Add Mapping</button></div>${tbl(['Source','Target','Types','Transformation','Params','Confidence','Risk','Status',''],p.maps.map((m,i)=>`<tr><td>${e(m.sources.join(', '))}</td><td>${e(m.targets.join(', '))}</td><td>${C.P.src[m.sources[0]]?C.P.src[m.sources[0]].type:''} → ${C.P.tgt[m.targets[0]]?C.P.tgt[m.targets[0]].type:''}</td><td><code>${m.transform}</code></td><td><code>${e(JSON.stringify(m.params||{}))}</code></td><td>${m.confidence}</td><td>${sev(m.risk)}</td><td>${bd(m.status,m.status==='REJECTED'?'red':m.status==='ACCEPTED'?'green':'blue')}</td><td><button class="s" onclick="mapDlg(${i})">Edit</button> <button class="s" onclick="setSt(${i},'ACCEPTED')">Accept</button> <button class="s" onclick="setSt(${i},'REJECTED')">Reject</button></td></tr>`))}</div>`+qrisk()},
appr(){if(!C.P)return hd('Approval')+needP();const p=plan();if(!p)return hd('Approval')+'<div class="card">No plan yet.</div>';const hi=p.risks.filter(r=>r.severity==='HIGH'&&r.status!=='RESOLVED').length,oq=C.P.qs.filter(q=>q.status==='OPEN').length;
 return hd('Approval',`Migration Plan v${p.v}`)+stats([['Mappings',p.maps.length],['High risks open',hi],['Medium risks',p.risks.filter(r=>r.severity==='MEDIUM').length],['Open questions',oq]])+`<div class="card">${p.approved?`${bd('Approved','green')} by ${e(p.approval.approved_by)} at ${e(p.approval.approved_at)} (${e(p.approval.approval_action)})`:`<label><input type="checkbox" id="ck" onchange="$('ab').disabled=!this.checked"> I reviewed the mapping and transformation plan.</label><div class="row"><button class="p" id="ab" disabled onclick="act('Approving plan',()=>api.approve(${p.id}),'Plan v${p.v} approved.')">Approve Migration Plan</button></div><div class="mu">The backend re-checks every gate; blocked reasons are shown above if it refuses.</div>`}</div>`},
dry(){if(!C.P)return hd('Dry Run')+needP();const p=plan();const d=p&&C.dries.filter(x=>x.plan_id===p.id).pop()||C.dries[C.dries.length-1];
 let h=hd('Dry Run','Deterministic, computed by the backend')+(p?`<div class="row"><button class="p" ${p.approved?'':'disabled'} onclick="act('Running dry run',async()=>{const r=await api.dry(${p.id});C.recs=null;C.dryId=r.id})">Run dry run on v${p.v}</button>${p.approved?'':bd('Approve the plan first','yellow')}</div>`:'<div class="card">No plan.</div>');
 if(!d)return h;const s=d.summary;h+=`<div class="mu">Dry run #${d.id} · plan v${d.plan_version} · hash ${d.hash} · ${e(d.created_at)}</div>`+stats([['Source records',s.source],['Processed',s.processed],['Accepted',s.accepted],['Rejected',s.rejected],['Transformation errors',s.transformation_errors],['Validation errors',s.validation_errors]])+`<div class="card"><div style="display:flex;height:12px;border-radius:6px;overflow:hidden"><div style="width:${s.accepted/s.source*100}%;background:var(--ok)"></div><div style="flex:1;background:var(--er)"></div></div></div>`;
 if(!C.recs||C.recsFor!==d.id){api.recs(d.id).then(r=>{C.recs=r;C.recsFor=d.id;render()}).catch(fail);return h+'<div class="card">Loading records...</div>'}
 const f=C.rf||'all',rs=C.recs.filter(r=>f==='all'||(f==='ok')===r.ok);
 h+=`<div class="card"><div class="row"><h3 style="margin:0">Records</h3><select onchange="C.rf=this.value;render()">${[['all','All'],['ok','Accepted'],['bad','Rejected']].map(x=>`<option value="${x[0]}" ${f===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div>${tbl(['Record','Email','Result','Failed fields'],rs.map(r=>`<tr class="click" onclick="C.detail=${r.idx};render()"><td>${e(r.rid)}</td><td>${e(r.source.email)}</td><td>${bd(r.ok?'ACCEPTED':'QUARANTINED',r.ok?'green':'red')}</td><td>${e(r.evidence.flatMap(x=>x.errors.map(y=>y.field+' ('+y.code+')')).join(', '))}</td></tr>`))}</div>`;
 const r=C.recs.find(x=>x.idx===C.detail);if(r)h+=`<div class="card"><h3>Record ${e(r.rid)} ${bd(r.ok?'VALID':'QUARANTINED',r.ok?'green':'red')}</h3>${tbl(['Source','Transformation','Target','Validation'],r.evidence.map(x=>`<tr><td>${Object.entries(x.sources).map(([k,v])=>`<code>${e(k)}</code> = ${e(JSON.stringify(v))}`).join('<br>')}</td><td><code>${x.transform}</code></td><td>${Object.entries(x.outputs).map(([k,v])=>`<code>${e(k)}</code> = ${e(JSON.stringify(v))}`).join('<br>')}</td><td>${x.ok?bd('VALID','green'):x.errors.map(y=>bd('FAILED','red')+` ${e(y.code)}: ${e(y.message)}<br>Expected: ${e(y.expected)} · Actual: ${e(JSON.stringify(y.actual))}<br>${bd('QUARANTINED','red')}`).join('<br>')}</td></tr>`))}</div>`;return h},
quar(){if(!C.P)return hd('Quarantine')+needP();const q=C.qf,all=C.hist?C.quar:[];
 const sel=(k,l,opts)=>`<label class="f"><span>${l}</span><select onchange="qf('${k}',this.value)"><option value="">All</option>${opts.map(o=>`<option ${String(q[k])===String(o)?'selected':''}>${e(o)}</option>`).join('')}</select></label>`;
 return hd('Quarantine','Rejected records with preserved field-level evidence')+`<div class="card"><div class="row">${sel('field','Field',Object.keys(C.P.tgt))}${sel('code','Error code',['REQUIRED_MISSING','TRANSFORM_FAILED','INVALID_EMAIL','INVALID_DATE','ENUM_VIOLATION','TYPE_MISMATCH','DUPLICATE_ID'])}${sel('plan_version','Plan version',C.plans.map(p=>p.v))}<label class="f"><span>Record ID</span><input value="${e(q.record_id||'')}" onchange="qf('record_id',this.value)"></label></div></div><div class="card">${tbl(['Record','Failed field','Source value','Transformation','Expected','Actual','Code','Message','Plan','Dry run','Time'],C.quar.map(x=>`<tr><td>${e(x.record_id)}</td><td>${x.failed_field}</td><td><code>${e(JSON.stringify(x.source_value))}</code></td><td>${x.transformation}</td><td>${e(x.expected_value)}</td><td><code>${e(JSON.stringify(x.actual_value))}</code></td><td>${bd(x.error_code,'red')}</td><td>${e(x.error_message)}</td><td>v${x.plan_version}</td><td>#${x.dry_run_id}</td><td>${e(x.timestamp)}</td></tr>`))}<div class="mu">${C.quar.length} quarantine entries</div></div>`},
exec(){if(!C.P)return hd('Execute Migration')+needP();const p=plan();if(!p)return hd('Execute Migration')+'<div class="card">No plan.</div>';const d=C.dries.filter(x=>x.plan_id===p.id).pop(),ready=p.approved&&d,mine=C.runs.filter(r=>r.plan_id===p.id);
 return hd('Execute Migration','Writes only to the mock target table')+`<div class="card"><pre>Plan version:    v${p.v}\nApproval status: ${p.approved?'APPROVED':'NOT APPROVED'}\nDry-run status:  ${d?'#'+d.id+' on v'+d.plan_version:'none for this version'}\nExpected records: ${d?d.summary.accepted:'-'}\nQuarantined:      ${d?d.summary.rejected:'-'}</pre><label><input type="checkbox" id="ck2" onchange="$('xb').disabled=!this.checked||${!ready}"> I understand this will execute the approved migration.</label><div class="row"><button class="p" id="xb" disabled onclick="runX(${p.id},${d?d.id:0})">${mine.length?'Retry Migration':'Approve &amp; Execute Migration'}</button></div></div>`+C.runs.map(r=>`<div class="card"><b>Migration Run #${r.id}</b> (plan v${r.plan_v}) ${r.rolled?bd('rolled back','gray'):bd('completed','green')}${stats([['Processed',r.processed],['Inserted',r.inserted],['Already exists',r.already_existed],['Failed',r.failed]])}${r.skipped?`<div>${bd('Duplicate prevention','blue')} ${r.processed} processed · ${r.skipped} already present · 0 duplicate records created</div>`:''}</div>`).join('')+`<div class="card"><h3>Mock target: customers (${C.target.length})</h3>${tbl(['Key','Run','Record','Data'],C.target.map(t=>`<tr><td><code>${e(t.key)}</code></td><td>${e(t.run_id)}</td><td>${e(t.rid)}</td><td><code>${e(JSON.stringify(t.data))}</code></td></tr>`))}</div>`},
recon(){if(!C.P)return hd('Reconciliation')+needP();const r=C.runs[C.runs.length-1];let h=hd('Reconciliation','Source vs quarantine vs target')+(r?`<div class="row"><button class="p" onclick="act('Reconciling run #${r.id}',()=>api.recon(${r.id}),'Reconciliation completed.')">Reconcile run #${r.id}</button></div>`:'<div class="card">Execute a migration first.</div>');
 for(const run of [...C.runs].reverse()){const x=C.recon[run.id];if(!x)continue;h+=`<div class="card"><b>Run #${run.id}</b> ${bd(x.status,x.status==='PASS'?'green':'red')}${stats([['Source total',x.source_total],['Accepted',x.accepted_total],['Quarantined',x.quarantined_total],['Expected target',x.expected_target_total],['Actual target',x.actual_target_total],['Missing',x.missing_ids.length],['Unexpected',x.unexpected_ids.length],['Duplicates',x.duplicate_ids.length]])}${x.status==='FAIL'?`<details open><summary>Discrepancy evidence</summary><pre>Missing IDs: ${e(x.missing_ids.join(', ')||'none')}\nUnexpected IDs: ${e(x.unexpected_ids.join(', ')||'none')}\nDuplicate IDs: ${e(x.duplicate_ids.join(', ')||'none')}\nKey mismatches: ${e(x.key_mismatches.join(', ')||'none')}</pre></details>`:''}</div>`}return h},
rb(){if(!C.P)return hd('Rollback')+needP();return hd('Rollback','Removes only rows created by the selected run')+(C.runs.map(r=>{const mine=C.target.filter(t=>t.run_id===r.id).length,other=C.target.length-mine,last=r.rollbacks[r.rollbacks.length-1];
 return `<div class="card"><b>Migration Run #${r.id}</b> ${r.rolled?bd('rolled back','gray'):''}<pre>Records created by this run: ${r.inserted}\nRecords eligible for rollback now: ${mine}\nUnrelated target records (protected): ${other}</pre><label><input type="checkbox" onchange="this.parentNode.nextElementSibling.firstElementChild.disabled=!this.checked"> I confirm rolling back run #${r.id}.</label><div class="row"><button class="d" disabled onclick="act('Rolling back run #${r.id}',async()=>{C.rb=await api.rollback(${r.id})},'Rollback finished.')">Confirm Rollback</button></div>${C.rb&&C.rb.migration_run_id===r.id?`<div>${bd(C.rb.status,'green')} Rolled back: ${C.rb.rolled_back} · Failed: ${C.rb.failed} · Untouched: ${C.rb.untouched}</div>`:''}${tbl(['Rollback','By','At','Rolled back','Status'],r.rollbacks.map(x=>`<tr><td>${x.id}</td><td>${e(x.performed_by)}</td><td>${e(x.performed_at)}</td><td>${x.records_rolled_back}</td><td>${x.status}</td></tr>`))}</div>`}).join('')||'<div class="card">No runs.</div>')},
hist(){if(!C.P)return hd('History')+needP();return hd('History','Append-only audit log')+`<div class="card">${[...C.hist].reverse().map(x=>`<div style="border-left:3px solid var(--ac);padding:2px 10px;margin:0 0 8px;cursor:pointer" onclick="C.open=C.open===${x.event_id}?null:${x.event_id};render()"><b>${e(x.event_type)}</b> <span class="mu">${e(x.timestamp)} · ${e(x.actor)}${x.plan_version?' · plan v'+x.plan_version:''}${x.migration_run_id?' · run #'+x.migration_run_id:''}</span>${C.open===x.event_id?`<pre>${e(JSON.stringify(x,null,1))}</pre>`:''}</div>`).join('')||'No events.'}</div>`}};
function qrisk(){const p=plan();if(!p)return'';return `<div class="card"><h3>Risks</h3>${tbl(['Risk','Field','Severity','Description','Potential impact','Recommendation','Status',''],p.risks.map(r=>`<tr><td>${r.id}</td><td>${e(r.field)}</td><td>${sev(r.severity)}</td><td>${e(r.description)}</td><td>${e(r.impact)}</td><td>${e(r.recommendation)}</td><td>${bd(r.status,r.status==='RESOLVED'?'green':'yellow')}</td><td>${p.approved?'':r.status==='RESOLVED'?`<button class="s" onclick="rk(${p.id},${r.id},'OPEN')">Reopen</button>`:`<button class="s" onclick="rk(${p.id},${r.id},'RESOLVED')">Resolve</button>`}</td></tr>`))}</div>
 <div class="card"><h3>Clarification questions</h3>${C.P.qs.map(q=>`<div class="row"><div style="flex:1;min-width:260px"><b>${q.id}.</b> ${e(q.question)}<br><span class="mu">${e(q.reason)} · fields: ${e(q.affected_fields.join(', '))}${q.resolved_by?' · resolved by '+e(q.resolved_by):''}</span></div><input id="qa${q.id}" placeholder="Answer" value="${e(q.answer||'')}"><select onchange="qs(${q.id},this.value)">${['OPEN','ANSWERED','RESOLVED'].map(s=>`<option ${q.status===s?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')||'none'}</div>`}
/* ===== actions (thin: every rule is enforced by the backend) ===== */
const rk=(p,r,s)=>act(s==='RESOLVED'?'Resolving risk':'Reopening risk',()=>api.risk(p,r,s));
const qs=(q,s)=>act('Updating question',()=>api.question(C.pid,q,s,($('qa'+q)||{}).value||null),'Question marked '+s.toLowerCase()+'.');
const setSt=(i,s)=>{const p=plan(),m=JSON.parse(JSON.stringify(p.maps));m[i].status=s;act('Saving mapping',async()=>{const r=await api.putMaps(p.id,m);C.sel=r.id})};
const cmp=(a,b)=>api.compare(a,b).then(r=>{C.cmp=r;render()}).catch(fail);
const qf=(k,v)=>{if(v)C.qf[k]=v;else delete C.qf[k];load().catch(fail)};
const runX=(pid,did)=>act('Executing migration',async()=>{const r=await api.exec(pid,did);C.lastX=r},'Done.').then(()=>{const r=C.lastX;if(r)status('ok',r.skipped?`Retry completed. ${r.skipped} already present, 0 duplicate records created.`:`Migration completed. ${r.inserted} records inserted.`)});
const saveJ=(id,k)=>{let o;try{o=JSON.parse($(id).value)}catch(x){return status('err','Invalid JSON: '+x.message)}act('Saving '+k+' schema',()=>api.schema(C.pid,k==='source'?'source':'target',o))};
const saveS=()=>{let o;try{o=JSON.parse($('sr').value)}catch(x){return status('err','Invalid JSON: '+x.message)}act('Saving samples',()=>api.samples(C.pid,o))};
/* Add/Edit mapping dialog. Parameter fields are chosen per transformation from the backend registry. */
function mapDlg(i){const p=plan(),m=i>=0?p.maps[i]:{sources:[],targets:[],transform:'rename',params:{}},sf=Object.keys(C.P.src),tf=Object.keys(C.P.tgt),pr=m.params||{};
 const ms=(id,opts,sel,multi)=>`<select id="${id}" ${multi?'multiple size="4"':''}>${opts.map(o=>`<option ${sel.includes(o)?'selected':''}>${o}</option>`).join('')}</select>`;
 $('dlg').innerHTML=`<h3>${i>=0?'Edit':'Add'} mapping</h3><label class="f"><span>Transformation</span><select id="dt" onchange="parSync()">${C.trans.map(t=>`<option ${t.name===m.transform?'selected':''} title="${e(t.description)}">${t.name}</option>`).join('')}</select></label>
 <label class="f"><span>Source field(s) (multi-select for combine_fields)</span>${ms('ds',sf,m.sources,true)}</label><label class="f"><span>Target field(s) (multi-select for split_field)</span>${ms('dg',tf,m.targets,true)}</label><div id="dp"></div><div id="de" style="color:var(--er)"></div>
 <div class="row"><button class="p" onclick="mapSave(${i})">Save mapping</button><button class="s" onclick="$('dlg').close()">Cancel</button></div>`;window.__pr=pr;parSync();$('dlg').showModal()}
function parSync(){const t=$('dt').value,pr=window.__pr||{},d=$('dp');
 d.innerHTML={date_format:`<label class="f"><span>Input format</span><select id="p_input_format">${['%d/%m/%Y','%m/%d/%Y','%Y-%m-%d','%d-%m-%Y'].map(x=>`<option ${(pr.input_format||'%d/%m/%Y')===x?'selected':''}>${x}</option>`).join('')}</select></label><div class="mu">Output is always ISO-8601 (YYYY-MM-DD).</div>`,
 null_to_default:`<label class="f"><span>Default value</span><input id="p_default" value="${e(pr.default||'')}"></label>`,
 enum_mapping:`<label class="f"><span>Source value → target value (one SRC=TARGET per line)</span><textarea id="p_mapping" rows="4">${e(Object.entries(pr.mapping||{M:'MALE',F:'FEMALE',U:'UNKNOWN'}).map(([k,v])=>k+'='+v).join('\n'))}</textarea></label>`,
 combine_fields:`<label class="f"><span>Separator</span><input id="p_separator" value="${e(pr.separator??' ')}"></label>`,split_field:`<label class="f"><span>Separator</span><input id="p_separator" value="${e(pr.separator??' ')}"></label>`}[t]||'<span class="mu">No parameters.</span>'}
function mapSave(i){const t=$('dt').value,sel=id=>[...$(id).selectedOptions].map(o=>o.value),pr={};
 if(t==='date_format')pr.input_format=$('p_input_format').value;if(t==='null_to_default')pr.default=$('p_default').value;if(t.endsWith('_fields')||t==='split_field')pr.separator=$('p_separator').value;
 if(t==='enum_mapping'){const mp={};for(const l of $('p_mapping').value.split('\n')){if(!l.trim())continue;const [k,v]=l.split('=');if(!k||!v){return $('de').textContent='Each enum line must be SRC=TARGET'}mp[k.trim().toUpperCase()]=v.trim()}pr.mapping=mp}
 const m={sources:sel('ds'),targets:sel('dg'),transform:t,params:pr},p=plan();
 const go=i>=0?()=>{const ms=JSON.parse(JSON.stringify(p.maps));ms[i]={...ms[i],...m};return api.putMaps(p.id,ms)}:()=>api.addMap(p.id,m);
 status('busy','Saving mapping...');go().then(async r=>{C.sel=r.id;$('dlg').close();await load();status('ok','Mapping saved (plan v'+r.v+').')}).catch(x=>{$('de').textContent=x.message;status('err',x.message)})}
function render(){$('nav').innerHTML='<b>Migration Workbench</b>'+NAV.map(([k,l])=>`<button class="${C.view===k?'on':''}" onclick="C.view='${k}';render()">${l}</button>`).join('')+`<div class="sys" style="color:#d8eef0;font-size:11px;padding:12px 8px;line-height:1.6"><b style="margin:0">System Status</b><br>API: ${C.sys?'Connected':'Unreachable'}<br>Database: ${C.sys?C.sys.database:'-'}<br>AI Mode: ${C.sys?C.sys.ai_mode:'-'}<br>Sample Limit: ${C.sys?C.sys.sample_limit:'-'}<br>Source: 1 · Target: 1</div>`;$('m').innerHTML=(V[C.view]||V.projects)()+(C.P&&C.view!=='projects'?`<div class="mu">Project: ${e(C.P.name)}</div>`:'')}
load().catch(fail);
</script></body></html>
